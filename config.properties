# =====================================================================
# Chat System - File cấu hình (dùng chung cho cả 2 phân hệ)
#
# Chỉ cần sửa file này là chạy được 2 file jar, không phải biên dịch lại.
# File nằm cạnh file jar (hoặc ở thư mục gốc dự án khi chạy bằng Maven / IDE).
#
# Mật khẩu thật của từng người: ghi vào config.local.properties (cùng thư mục,
# đã nằm trong .gitignore) để không bị đẩy lên GitHub. File local ghi đè file này.
# Khi nộp bài: để trống db.password, smtp.password, llm.api.key.
# =====================================================================

# ----- Kết nối MySQL (chạy script/create_db.sql trước) -----
db.host=localhost
db.port=3306
db.name=chat_system
db.user=root
db.password=

# ----- Gửi email cho chức năng Quên mật khẩu (SMTP) -----
# Để trống thì chức năng báo lỗi nhẹ, các chức năng khác vẫn chạy.
smtp.host=smtp.gmail.com
smtp.port=587
smtp.user=
smtp.password=
# Địa chỉ người gửi hiện trong email (thường trùng smtp.user)
smtp.from=

# ----- Gợi ý tin nhắn bằng LLM (Khang chốt nhà cung cấp rồi bổ sung khoá ở đây) -----
# Để trống thì nút Gợi ý báo lỗi nhẹ, các chức năng khác vẫn chạy.
llm.url=
llm.api.key=
llm.model=
